name: hermes-vision-inline
version: "1.0.0"
description: "A Hermes plugin that lets your model look at images and video inline, instead of getting a written description from the auxiliary model. Keeping the image inline preserves context, enables direct inspection and follow-ups, and avoids the complexity of a separate captioning model." 
author: BrokeSkill
license: MIT
provides_middleware:
  - tool_execution
